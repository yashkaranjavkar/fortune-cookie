<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Personalization Profile</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 340px; padding: 16px; }
    .brand { margin-bottom: 14px; }
    .brand img { width: 30px; height: 30px; }
    .brand h1 { font-size: 16px; }
    .brand .pill { margin-left: auto; }
    .status { margin: 10px 0 14px; color: var(--text-2); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 12px; color: var(--muted); }
    h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    ol { margin: 0 0 16px; padding-left: 20px; }
    ol li { padding: 2px 0; overflow-wrap: anywhere; }
    ol li small { color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    .actions .btn { flex: 1; }
  </style>
</head>
<body>
  <div class="brand">
    <img src="../icons/icon-128.png" alt="">
    <div><small>Personalization</small><h1>Browsing profile</h1></div>
    <span class="pill" id="pill"></span>
  </div>

  <div id="setup" hidden>
    <p class="status">Add your details and agree to start recording.</p>
    <button class="btn" id="open-setup" style="width:100%">Set up</button>
  </div>

  <div id="main" hidden>
    <div id="progress"></div>
    <p class="status" id="status"></p>
    <div class="stats">
      <div class="stat"><b id="host-count">0</b><span>websites recorded</span></div>
      <div class="stat"><b id="visit-count">0</b><span>visits</span></div>
    </div>
    <h2>Most visited so far</h2>
    <ol id="top"></ol>
    <div class="actions">
      <button class="btn secondary" id="pause"></button>
      <button class="btn" id="open-dashboard">Dashboard</button>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
